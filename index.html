<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chem Bonding Drills</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a topic board that swaps in place for a single-question drill card. */
:root{
  --bg:#f6f7f4; --panel:#ffffff; --panel-2:#eef0ea; --line:#d9ddd2;
  --fg:#1d2420; --muted:#5f6b63; --accent:#0f6b5c; --accent-soft:#dcefe9;
  --good:#1a7a46; --good-soft:#dcf0e2; --bad:#a52f2a; --bad-soft:#f8e2df;
  --warn:#8a5a10; --warn-soft:#fbeed3;
  --d1:#2f7d6a; --d2:#9a6a12; --d3:#8d3a63; --on-accent:#ffffff;
  --font-h:'Sora',system-ui,sans-serif; --font-b:'Inter',system-ui,sans-serif; --font-m:'JetBrains Mono',ui-monospace,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13181a; --panel:#1b2225; --panel-2:#222b2e; --line:#2f3a3e;
  --fg:#e8eeeb; --muted:#9aaaa3; --accent:#5ad0b5; --accent-soft:#17352f;
  --good:#58cf8d; --good-soft:#143025; --bad:#f08b83; --bad-soft:#361b19;
  --warn:#e5b557; --warn-soft:#332714;
  --d1:#6ed3b9; --d2:#e0b35e; --d3:#dd8fb6; --on-accent:#07201c;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#13181a; --panel:#1b2225; --panel-2:#222b2e; --line:#2f3a3e;
  --fg:#e8eeeb; --muted:#9aaaa3; --accent:#5ad0b5; --accent-soft:#17352f;
  --good:#58cf8d; --good-soft:#143025; --bad:#f08b83; --bad-soft:#361b19;
  --warn:#e5b557; --warn-soft:#332714;
  --d1:#6ed3b9; --d2:#e0b35e; --d3:#dd8fb6; --on-accent:#07201c;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3{font-family:var(--font-h);text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer}
.mono{font-family:var(--font-m)}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.hrow{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--font-h);font-weight:700;font-size:1.05rem;letter-spacing:-.01em;margin-right:auto}
.brand span{display:block;font-family:var(--font-b);font-weight:400;font-size:.76rem;color:var(--muted);letter-spacing:.02em}
.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:500}
.ghost:hover{color:var(--fg);border-color:var(--accent)}

/* stat strip */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font-family:var(--font-h);font-size:1.35rem;font-variant-numeric:tabular-nums;line-height:1.15}
.stat small{color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.07em}

/* topic board */
.sect{margin-top:28px}
.sect > h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;margin-bottom:10px}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.topic{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;transition:border-color .15s,transform .15s}
.topic:hover{border-color:var(--accent);transform:translateY(-1px)}
.topic .tt{font-family:var(--font-h);font-weight:600;font-size:1rem}
.topic .td{color:var(--muted);font-size:.82rem;min-height:2.4em}
.bar{height:5px;border-radius:999px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.meta{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.mixed{background:linear-gradient(135deg,var(--accent-soft),var(--panel));border-color:var(--accent)}

/* controls */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 13px;font-size:.82rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}

/* quiz card */
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:18px}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tag{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--panel-2);color:var(--muted)}
.tag.d1{color:var(--d1)}.tag.d2{color:var(--d2)}.tag.d3{color:var(--d3)}
.qnum{margin-left:auto;font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.qtext{font-family:var(--font-h);font-size:1.17rem;font-weight:600;white-space:pre-wrap;line-height:1.4}
.qtext .eq{display:block;font-family:var(--font-m);font-size:1.02rem;font-weight:500;margin-top:10px;padding:10px 12px;background:var(--panel-2);border-radius:10px;overflow-x:auto;white-space:pre}
.hintline{color:var(--muted);font-size:.84rem;margin-top:8px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt{display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--fg);transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .box{flex:none;width:21px;height:21px;border:1.5px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:.7rem;font-weight:700;margin-top:1px}
.opt.multi .box{border-radius:6px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .box{border-color:var(--accent);background:var(--accent);color:var(--panel)}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.correct .box{border-color:var(--good);background:var(--good);color:var(--panel)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .box{border-color:var(--bad);background:var(--bad);color:var(--panel)}
.opt .txt{min-width:0;word-break:break-word}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
.primary{background:var(--accent);color:var(--on-accent);border:none;border-radius:11px;padding:11px 22px;font-weight:600}
.primary:disabled{opacity:.45;cursor:default}
.tries{font-size:.82rem;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.dots{display:inline-flex;gap:4px;vertical-align:-2px;margin-left:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line)}
.dots i.used{background:var(--bad);border-color:var(--bad)}
.feedback{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:.92rem;border:1px solid}
.feedback.ok{background:var(--good-soft);border-color:var(--good)}
.feedback.no{background:var(--warn-soft);border-color:var(--warn)}
.feedback.out{background:var(--bad-soft);border-color:var(--bad)}
.feedback b{font-family:var(--font-h);display:block;margin-bottom:4px}
.feedback .why{color:var(--fg);opacity:.9}
.srcline{margin-top:10px;font-size:.74rem;color:var(--muted)}
.progwrap{margin-top:16px}
.progwrap .bar{height:6px}
.empty{color:var(--muted);text-align:center;padding:34px 10px}
footer{margin-top:34px;color:var(--muted);font-size:.76rem;text-align:center}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.qtext{font-size:1.07rem}}
</style>
</head>
<body>

<header><div class="hrow">
  <div class="brand">Chem Bonding Drills<span id="sub">Bonding, VSEPR, reactions &amp; equations</span></div>
  <button class="ghost" id="themeBtn" type="button">Theme</button>
  <button class="ghost" id="resetBtn" type="button">Reset progress</button>
</div></header>

<div class="wrap">
  <div id="board">
    <div class="stats">
      <div class="stat"><b id="sTot">0</b><small>Answered</small></div>
      <div class="stat"><b id="sFirst">0%</b><small>First try</small></div>
      <div class="stat"><b id="sStreak">0</b><small>Streak</small></div>
      <div class="stat"><b id="sBank">0</b><small>In the bank</small></div>
    </div>
    <div class="sect">
      <h2>Difficulty</h2>
      <div class="chips" id="diffChips"></div>
    </div>
    <div class="sect">
      <h2>Pick a topic</h2>
      <div class="topics" id="topicGrid"></div>
    </div>
  </div>
  <div id="quiz" hidden></div>
  <footer>Questions compiled from the Formative quizzes, Dougherty Valley worksheets and tutor notes, plus extra practice in the same style.</footer>
</div>
<script>
/* ---------- helpers ---------- */
const BANK = [];
const SRC = { F: 'Formative quiz', W: 'Class worksheet', T: 'Tutor notes', X: 'Extra practice' };
function pick(arr, n) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a.slice(0, n); }
function Q(t, d, q, a, w, x, s) { BANK.push({ t, d, q, o: [a, ...w], c: [a], x, s: s || 'X', m: false }); }
function M(t, d, q, a, w, x, s) { BANK.push({ t, d, q, o: [...a, ...w], c: a.slice(), x, s: s || 'X', m: true }); }
const SHAPES = ['Linear', 'Bent', 'Trigonal planar', 'Trigonal pyramidal', 'Tetrahedral', 'Seesaw', 'T-shaped', 'Trigonal bipyramidal', 'Square planar', 'Square pyramidal', 'Octahedral'];
const EGS = ['Linear', 'Trigonal planar', 'Tetrahedral', 'Trigonal bipyramidal', 'Octahedral'];
function geo(sp, shape, d, x, s) { Q('vsepr', d, 'What is the molecular geometry of ' + sp + '?', shape, pick(SHAPES.filter(z => z !== shape), 3), x, s); }
function egeo(sp, shape, d, x, s) { Q('vsepr', d, 'What is the electron geometry (arrangement of all electron pairs) around the central atom of ' + sp + '?', shape, pick(EGS.filter(z => z !== shape), 3), x, s); }
function lp(sp, n, d, x, s) { Q('lewis', d, 'How many lone pairs are on the central atom of ' + sp + '?', String(n), ['0', '1', '2', '3'].filter(z => z !== String(n)).slice(0, 3), x, s); }
function bonded(sp, n, d, x, s) { const all = ['2', '3', '4', '5', '6'].filter(z => z !== String(n)); Q('lewis', d, 'How many atoms are bonded to the central atom of ' + sp + '?', String(n), pick(all, 3), x, s); }
function val(sp, n, d, x, s) { const w = [n - 2, n + 2, n - 4, n + 4, n + 6].filter(z => z > 0); Q('lewis', d, 'How many total valence electrons must be shown in the Lewis structure of ' + sp + '?', String(n), pick(w, 3).map(String), x, s); }
function hyb(sp, h, d, x, s) { Q('vsepr', d, 'What is the hybridization of the central atom in ' + sp + '?', h, pick(['sp', 'sp²', 'sp³', 'sp³d', 'sp³d²'].filter(z => z !== h), 3), x, s); }
function ang(sp, a, wrong, d, x, s) { Q('vsepr', d, 'What is the approximate bond angle in ' + sp + '?', a, wrong, x, s); }
function typ(eq, ans, d, x, s) { const T = ['Synthesis', 'Decomposition', 'Single displacement', 'Double displacement', 'Combustion']; Q('types', d, 'What type of reaction is this?\n' + eq, ans, T.filter(z => z !== ans).slice(0, 4).length ? pick(T.filter(z => z !== ans), 3) : [], x, s); }
function bal(t, d, unb, ok, wrong, x, s) { Q(t, d, 'Which is the correctly balanced equation for:\n' + unb, ok, wrong, x || 'Count each element on both sides. A balanced equation has the same number of each kind of atom before and after the arrow.', s); }
function imf(sp, ans, d, x, s) { const A = ['London dispersion', 'Dipole-dipole', 'Hydrogen bonding', 'Ionic bonding']; Q('imf', d, 'What is the strongest intermolecular force (or attraction) in ' + sp + '?', ans, A.filter(z => z !== ans), x, s); }

/* ---------- IONS & NAMING ---------- */
Q('ions', 1, 'Which formula is the sulfate ion?', 'SO₄²⁻', ['SO₃²⁻', 'SO₄⁻', 'S²⁻'], 'Sulfate is SO₄²⁻. Sulfite is SO₃²⁻ (one fewer oxygen). Sulfide is the single-atom ion S²⁻.', 'W');
Q('ions', 1, 'Which formula is the ammonium ion?', 'NH₄⁺', ['NH₃', 'NH₄⁻', 'NH₂⁺'], 'Ammonium is NH₄⁺. NH₃ is the neutral molecule ammonia.', 'W');
Q('ions', 1, 'Which formula is the nitrate ion?', 'NO₃⁻', ['NO₂⁻', 'N³⁻', 'NO₃²⁻'], 'Nitrate is NO₃⁻. Nitrite is NO₂⁻, and nitride is N³⁻.', 'W');
Q('ions', 1, 'Which formula is the phosphate ion?', 'PO₄³⁻', ['PO₃³⁻', 'P³⁻', 'PO₄²⁻'], 'Phosphate is PO₄³⁻. Phosphite is PO₃³⁻ (one fewer oxygen). Phosphide is P³⁻.', 'W');
Q('ions', 1, 'Which formula is the carbonate ion?', 'CO₃²⁻', ['HCO₃⁻', 'CO₃⁻', 'CO₂²⁻'], 'Carbonate is CO₃²⁻. HCO₃⁻ is hydrogen carbonate (bicarbonate).', 'W');
Q('ions', 1, 'Which formula is the hydroxide ion?', 'OH⁻', ['H₃O⁺', 'H⁻', 'O²⁻'], 'Hydroxide is OH⁻. H₃O⁺ is hydronium, H⁻ is hydride, and O²⁻ is oxide.', 'W');
Q('ions', 1, 'Which formula is the acetate ion?', 'C₂H₃O₂⁻', ['CO₃²⁻', 'C₂H₃O₂⁺', 'CN⁻'], 'Acetate is C₂H₃O₂⁻ (also written CH₃COO⁻).', 'T');
Q('ions', 2, 'Which formula is the phosphite ion?', 'PO₃³⁻', ['PO₄³⁻', 'PO₂³⁻', 'P³⁻'], 'Phosphite has one fewer oxygen than phosphate: PO₃³⁻.', 'W');
Q('ions', 2, 'Which formula is the sulfite ion?', 'SO₃²⁻', ['SO₄²⁻', 'S₂O₃²⁻', 'HSO₃⁻'], 'Sulfite is SO₃²⁻. S₂O₃²⁻ is thiosulfate and HSO₃⁻ is hydrogen sulfite (bisulfite).', 'W');
Q('ions', 2, 'What is the name of ClO₃⁻?', 'Chlorate', ['Chlorite', 'Perchlorate', 'Hypochlorite'], 'ClO₄⁻ perchlorate, ClO₃⁻ chlorate, ClO₂⁻ chlorite, ClO⁻ hypochlorite. Fewer oxygens means a lower-sounding name.', 'W');
Q('ions', 2, 'What is the name of ClO₂⁻?', 'Chlorite', ['Chlorate', 'Perchlorate', 'Hypochlorite'], 'ClO₂⁻ is chlorite. ClO₃⁻ is chlorate.', 'W');
Q('ions', 2, 'Which formula is the permanganate ion?', 'MnO₄⁻', ['MnO₄²⁻', 'Mn²⁺', 'MnO₂'], 'Permanganate is MnO₄⁻. Mn²⁺ is the manganese(II) cation.', 'W');
Q('ions', 2, 'Which formula is the dichromate ion?', 'Cr₂O₇²⁻', ['CrO₄²⁻', 'Cr₂O₄²⁻', 'Cr³⁺'], 'Dichromate is Cr₂O₇²⁻. Chromate is CrO₄²⁻.', 'W');
Q('ions', 2, 'Which formula is the thiosulfate ion?', 'S₂O₃²⁻', ['SO₃²⁻', 'SO₄²⁻', 'SCN⁻'], 'Thiosulfate is S₂O₃²⁻ (sulfate with one O replaced by S).', 'W');
Q('ions', 2, 'Hydrogen carbonate (bicarbonate) has which formula?', 'HCO₃⁻', ['H₂CO₃', 'CO₃²⁻', 'HCO₃²⁻'], 'Add one H⁺ to carbonate CO₃²⁻ and the charge drops from 2− to 1−, giving HCO₃⁻.', 'W');
Q('ions', 2, 'Which formula is the cyanide ion?', 'CN⁻', ['SCN⁻', 'CNO⁻', 'C₂²⁻'], 'Cyanide is CN⁻. SCN⁻ is thiocyanate.', 'W');
Q('ions', 3, 'The mercury(I) ion is written as…', 'Hg₂²⁺', ['Hg⁺', 'Hg²⁺', 'Hg₂⁺'], 'Evidence shows mercury(I) exists as a pair of bonded atoms, Hg₂²⁺, not as a lone Hg⁺. Mercury(II) is Hg²⁺.', 'W');
Q('ions', 1, 'Which of these is a polyatomic ion?', 'NH₄⁺', ['Ca²⁺', 'Cl⁻', 'O²⁻'], 'A polyatomic ion has more than one atom. Ca²⁺, Cl⁻ and O²⁻ are single-atom ions.', 'T');
M('ions', 1, 'Select ALL the polyatomic ions.', ['NH₄⁺', 'SO₄²⁻', 'CO₃²⁻'], ['Br⁻', 'N³⁻'], 'NH₄⁺, SO₄²⁻ and CO₃²⁻ each contain several atoms. Br⁻ and N³⁻ are single-atom ions.', 'T');
Q('ions', 1, 'What is the formula of calcium sulfate?', 'CaSO₄', ['Ca₂SO₄', 'Ca(SO₄)₂', 'CaS'], 'Ca²⁺ and SO₄²⁻ have equal and opposite charges, so they combine 1:1.', 'W');
Q('ions', 2, 'What is the formula of aluminum sulfate?', 'Al₂(SO₄)₃', ['AlSO₄', 'Al₃(SO₄)₂', 'Al(SO₄)₃'], 'Al³⁺ and SO₄²⁻: cross the charges to get Al₂(SO₄)₃ (total +6 and −6). Brackets are needed around the polyatomic ion.', 'T');
Q('ions', 2, 'What is the formula of ammonium phosphate?', '(NH₄)₃PO₄', ['NH₄PO₄', '(NH₄)₂PO₄', 'NH₄(PO₄)₃'], 'NH₄⁺ is 1+ and PO₄³⁻ is 3−, so three ammoniums balance one phosphate.', 'T');
Q('ions', 2, 'What is the formula of magnesium hydroxide?', 'Mg(OH)₂', ['MgOH', 'MgOH₂', 'Mg₂OH'], 'Mg²⁺ needs two OH⁻ ions, so OH goes in brackets with a 2.', 'T');
Q('ions', 2, 'What is the formula of aluminum acetate?', 'Al(C₂H₃O₂)₃', ['AlC₂H₃O₂', 'Al₃(C₂H₃O₂)', 'Al₂(C₂H₃O₂)₃'], 'Al³⁺ needs three acetate (1−) ions.', 'T');
Q('ions', 2, 'What is the formula of calcium phosphate?', 'Ca₃(PO₄)₂', ['CaPO₄', 'Ca₂(PO₄)₃', 'Ca₃PO₄'], 'Cross the charges: Ca²⁺ and PO₄³⁻ gives Ca₃(PO₄)₂ (6+ and 6−).', 'W');
Q('ions', 2, 'What is the formula of potassium chromate?', 'K₂CrO₄', ['KCrO₄', 'K₂Cr₂O₇', 'K(CrO₄)₂'], 'K⁺ is 1+ and CrO₄²⁻ is 2−, so two potassiums are needed.', 'T');
Q('ions', 2, 'What is the formula of barium nitrate?', 'Ba(NO₃)₂', ['BaNO₃', 'Ba₂NO₃', 'BaNO₆'], 'Ba²⁺ needs two NO₃⁻ ions.', 'T');
Q('ions', 2, 'What is the formula of zinc sulfate?', 'ZnSO₄', ['Zn₂SO₄', 'Zn(SO₄)₂', 'ZnS'], 'Zn²⁺ and SO₄²⁻ balance 1:1.', 'T');
Q('ions', 1, 'What is the name of (NH₄)₂SO₄?', 'Ammonium sulfate', ['Ammonium sulfite', 'Nitrogen hydrogen sulfate', 'Ammonia sulfate'], 'NH₄⁺ is ammonium and SO₄²⁻ is sulfate.', 'T');
Q('ions', 2, 'What is the name of Pb(NO₃)₂?', 'Lead(II) nitrate', ['Lead nitrite', 'Lead(I) nitrate', 'Lead dinitrate'], 'Two NO₃⁻ balance Pb²⁺, so it is lead(II) nitrate.', 'T');
Q('ions', 2, 'What is the name of MnCl₂?', 'Manganese(II) chloride', ['Manganese chloride(I)', 'Manganese(IV) chloride', 'Manganese dichloride(II)'], 'Two Cl⁻ means Mn is 2+, so Roman numeral (II).', 'T');
Q('ions', 2, 'What is the charge on iron in Fe₂O₃?', '3+', ['2+', '6+', '1+'], 'Three O²⁻ gives 6−. Two Fe must give 6+, so each is 3+, iron(III).', 'T');
Q('ions', 1, 'What is the name of Al₂O₃?', 'Aluminum oxide', ['Aluminum trioxide', 'Dialuminum oxide', 'Aluminum oxygen'], 'Ionic compounds are named cation then anion, with no prefixes.', 'T');
Q('ions', 2, 'What is the name for the compound NaOH?', 'Sodium hydroxide', ['Sodium hydride', 'Sodium oxide', 'Sodium hydrogen oxide'], 'Na⁺ is sodium and OH⁻ is hydroxide.', 'T');
Q('ions', 1, 'What is the formula of phosphorus trichloride?', 'PCl₃', ['P₃Cl', 'PCl', 'P₃Cl₃'], 'The prefix tri- means three chlorine atoms. Covalent compounds use prefixes.', 'W');
Q('ions', 1, 'What is the formula of carbon tetrahydride (methane)?', 'CH₄', ['C₄H', 'CH', 'C₄H₄'], 'Tetra- means four hydrogens.', 'W');
Q('ions', 2, 'Which compound is ionic?', 'Ammonium chloride (NH₄Cl)', ['Phosphorus trichloride (PCl₃)', 'Hydrogen sulfide (H₂S)', 'Carbon tetrahydride (CH₄)'], 'NH₄Cl is made of NH₄⁺ and Cl⁻ ions. The other three are molecules of nonmetals sharing electrons.', 'W');
Q('ions', 1, 'Is calcium sulfate (CaSO₄) ionic or covalent?', 'Ionic', ['Covalent', 'Metallic', 'Network covalent'], 'It contains a metal (Ca) and a polyatomic anion, so it is ionic. Inside SO₄²⁻ the bonds are covalent, but the compound overall is ionic.', 'W');
Q('ions', 1, 'Is NH₃ ionic or covalent?', 'Covalent', ['Ionic', 'Metallic', 'Cannot tell'], 'N and H are both nonmetals, so they share electrons.', 'W');
Q('ions', 1, 'Is H₂S ionic or covalent?', 'Covalent', ['Ionic', 'Metallic', 'Cannot tell'], 'Two nonmetals (H and S) share electrons.', 'W');

/* ---------- ELECTRONEGATIVITY ---------- */
Q('en', 1, 'A bond with a difference in electronegativity (ΔEN) less than 0.5 is…', 'non-polar covalent', ['polar covalent', 'ionic', 'metallic'], 'ΔEN < 0.5 non-polar covalent; 0.5 to 1.8 polar covalent; greater than 1.8 ionic.', 'F');
Q('en', 1, 'A bond with ΔEN between 0.5 and 1.8 is…', 'polar covalent', ['non-polar covalent', 'ionic', 'metallic'], 'Electrons are shared unequally, creating partial charges δ+ and δ−.', 'F');
Q('en', 1, 'A bond with ΔEN greater than 1.8 is usually…', 'ionic', ['non-polar covalent', 'polar covalent', 'metallic'], 'Such a large difference means one atom effectively takes the electron.', 'F');
Q('en', 2, 'Complete the sentence: The bond between H–O is __(a)__ because __(b)__.   (H = 2.1, O = 3.5)', 'polar; 0.5 < ΔEN < 1.8', ['non-polar; ΔEN < 0.5', 'ionic; ΔEN > 1.8', 'polar; ΔEN > 1.8'], 'ΔEN = 3.5 − 2.1 = 1.4. That falls between 0.5 and 1.8, so the bond is polar covalent.', 'F');
Q('en', 2, 'If an MgX compound has an electronegativity difference of 2.8 and Mg is 1.2, what is X?', 'F 4.0', ['Br 2.8', 'Cl 3.0', 'O 3.5'], 'X = 1.2 + 2.8 = 4.0, which is fluorine.', 'F');
Q('en', 2, 'Which compound would have ΔEN = 2.1? (Na = 0.9, Cl = 3.0)', 'NaCl', ['Cl₂', 'HCl', 'Na metal'], '3.0 − 0.9 = 2.1, which is more than 1.8, so ionic.', 'X');
Q('en', 1, 'What type of bond is Cl–Cl?', 'non-polar covalent', ['polar covalent', 'ionic', 'metallic'], 'Identical atoms have ΔEN = 0, so electrons are shared equally.', 'X');
Q('en', 2, 'What type of bond is C–H? (C = 2.5, H = 2.1)', 'non-polar covalent', ['polar covalent', 'ionic', 'metallic'], 'ΔEN = 0.4, which is under 0.5. This is why C–H bonds are treated as non-polar.', 'T');
Q('en', 2, 'What type of bond is N–H? (N = 3.0, H = 2.1)', 'polar covalent', ['non-polar covalent', 'ionic', 'metallic'], 'ΔEN = 0.9, between 0.5 and 1.8.', 'X');
Q('en', 2, 'What type of bond is Mg–O? (Mg = 1.2, O = 3.5)', 'ionic', ['polar covalent', 'non-polar covalent', 'metallic'], 'ΔEN = 2.3, above 1.8. A metal bonded to a nonmetal is also a clue for ionic.', 'X');
Q('en', 2, 'What type of bond is H–Cl? (H = 2.1, Cl = 3.0)', 'polar covalent', ['ionic', 'non-polar covalent', 'metallic'], 'ΔEN = 0.9.', 'X');
Q('en', 2, 'What type of bond is C–O? (C = 2.5, O = 3.5)', 'polar covalent', ['non-polar covalent', 'ionic', 'metallic'], 'ΔEN = 1.0.', 'X');
Q('en', 2, 'In an H–Cl bond, which atom carries the partial negative charge (δ−)?', 'Cl, because it is more electronegative', ['H, because it is smaller', 'Cl, because it is smaller', 'Neither, the sharing is equal'], 'Shared electrons are pulled toward the more electronegative atom.', 'X');
Q('en', 2, 'Which bond is the MOST polar?', 'O–H', ['C–H', 'N–H', 'Cl–H'], 'ΔEN with H (2.1): C 0.4, Cl 0.9, N 0.9, O 1.4. Oxygen is the most electronegative of these.', 'X');
Q('en', 2, 'Which element is the most electronegative?', 'F', ['O', 'Cl', 'N'], 'Electronegativity increases across a period and up a group, so fluorine is highest (4.0).', 'X');
Q('en', 3, 'Arrange in INCREASING electronegativity: N, O, F, P, C, B', 'B < P < C < N < O < F', ['B < C < P < N < O < F', 'F < O < N < C < P < B', 'P < B < C < N < F < O'], 'B 2.0, P 2.1, C 2.5, N 3.0, O 3.5, F 4.0.', 'T');
Q('en', 2, 'Across a period (left to right), electronegativity generally…', 'increases', ['decreases', 'stays the same', 'increases then decreases'], 'Greater nuclear charge pulls bonding electrons harder with the same number of shells.', 'X');
Q('en', 2, 'Down a group, electronegativity generally…', 'decreases', ['increases', 'stays the same', 'doubles'], 'More electron shells put bonding electrons farther from the nucleus.', 'X');
Q('en', 3, 'Which pair has the largest electronegativity difference?', 'Cl and F', ['Cl and Br', 'Si and Al', 'C and H'], 'Cl 3.0 / F 4.0 gives 1.0, versus Cl/Br 0.2, Si/Al 0.3, C/H 0.4.', 'T');
Q('en', 2, 'Ca (1.0) bonds with Cl (3.0). The bond is…', 'ionic', ['non-polar covalent', 'polar covalent', 'metallic'], 'ΔEN = 2.0, which is greater than 1.8.', 'X');
Q('en', 3, 'Si (1.8) bonds with Cl (3.0). The bond is…', 'polar covalent', ['ionic', 'non-polar covalent', 'metallic'], 'ΔEN = 1.2, between 0.5 and 1.8.', 'X');

/* ---------- BONDING TYPES & PROPERTIES ---------- */
Q('bonds', 1, 'A student wants a material that conducts electricity AND has delocalized electrons. Which substance fits?', 'Al', ['CH₄', 'N₂', 'PF₃'], 'Al is a metal. Metals have a sea of delocalized electrons. The others are covalent molecules.', 'F');
Q('bonds', 1, 'Why do metals conduct electricity?', 'They contain delocalized (free-moving) electrons', ['They contain free ions in the solid', 'They have lone pairs', 'Their atoms share electrons in pairs'], 'Valence electrons move through the lattice of metal cations, carrying charge.', 'T');
Q('bonds', 2, 'Why does a metallic structure conduct electricity but a covalently bonded structure does not?', 'Metals have free-moving electrons; covalent molecules have all electrons held in bonds or lone pairs', ['Metals have more protons', 'Covalent bonds are weaker', 'Covalent substances are always liquids'], 'Conductivity needs mobile charges. Metals have an electron sea. Simple covalent molecules have no free charges.', 'W');
Q('bonds', 1, 'In a metallic bond, the cations are surrounded by…', 'a sea of delocalized electrons', ['shared electron pairs', 'negative ions', 'lone pairs only'], 'This electron sea holds the metal together and lets it conduct.', 'T');
Q('bonds', 1, 'Which of these is a network covalent solid?', 'Diamond', ['NaCl', 'CH₄', 'Copper'], 'In diamond every carbon is covalently bonded to four others in a continuous 3D network.', 'T');
Q('bonds', 2, 'Which is the best definition of a network covalent solid?', 'A continuous 3D network of atoms held together only by strong covalent bonds', ['Cations in a sea of electrons', 'Separate molecules held by weak forces', 'Oppositely charged ions in a lattice'], 'Examples: diamond and quartz (SiO₂).', 'W');
Q('bonds', 2, 'Which is the best definition of an ionic lattice?', 'A rigid repeating 3D array of cations and anions held by strong electrostatic attraction', ['Atoms sharing pairs of electrons in molecules', 'A sea of electrons around cations', 'Molecules attracted by partial charges'], 'NaCl is the classic example with a cubic lattice.', 'W');
Q('bonds', 1, 'Which substance has an ionic lattice?', 'NaCl', ['Diamond', 'CH₄', 'Al'], 'NaCl is made of Na⁺ and Cl⁻ ions arranged in a cubic lattice.', 'T');
Q('bonds', 1, 'What force holds NaCl units together?', 'Electrostatic attraction between Na⁺ and Cl⁻ ions (ionic bond)', ['Sharing of electron pairs', 'London dispersion forces', 'A sea of electrons'], 'Opposite charges attract.', 'W');
Q('bonds', 2, 'Which has stronger bonding overall, diamond or graphite?', 'Diamond, because every carbon forms four strong covalent bonds in all three dimensions', ['Graphite, because it is softer', 'They are identical', 'Graphite, because it conducts'], 'Graphite has layers held by weak forces, so it is soft and slippery. Diamond is a rigid 3D network.', 'W');
Q('bonds', 3, 'Rank from strongest to weakest bonding: diamond, water, sulfur dihydride (H₂S), methane', 'Diamond > water > H₂S > methane', ['Water > diamond > H₂S > methane', 'Diamond > methane > H₂S > water', 'Methane > H₂S > water > diamond'], 'Diamond (network covalent) is strongest. Water has hydrogen bonds. H₂S has weaker dipole-dipole. Methane has only weak London forces.', 'W');
Q('bonds', 2, 'Which substance would you expect to have the LOWEST boiling point?', 'Methane (gas)', ['Diamond (solid)', 'Glycerine (liquid)', 'Copper (solid)'], 'Methane has only weak London dispersion forces between molecules. The others have much stronger bonding.', 'W');
Q('bonds', 2, 'What type of intermolecular bond connects two polar molecules?', 'dipole-dipole', ['metallic', 'covalent', 'London dispersion'], 'Positive end of one polar molecule attracts the negative end of another.', 'W');
Q('bonds', 1, 'What is the difference between an intramolecular and an intermolecular force?', 'Intra acts within a molecule (covalent bond); inter acts between molecules', ['Intra acts between molecules; inter acts within one', 'They are the same thing', 'Intra only occurs in ionic compounds'], 'Example intra: the O–H covalent bond in water. Example inter: hydrogen bonds between water molecules.', 'W');
Q('bonds', 2, 'When water boils, which attractions are overcome?', 'Intermolecular hydrogen bonds between molecules', ['The O–H covalent bonds inside molecules', 'The ionic bonds in water', 'The metallic bonds'], 'Boiling separates molecules but leaves each H₂O molecule intact.', 'X');
Q('bonds', 2, 'Which solid conducts electricity when molten but not when solid?', 'Ionic compound (e.g. NaCl)', ['Metal', 'Diamond', 'Methane'], 'In the solid, ions are locked in place. When molten, they are free to move and carry charge.', 'X');
Q('bonds', 2, 'Why are metals malleable (can be hammered into sheets)?', 'Layers of cations can slide past each other while the electron sea keeps holding them together', ['Their covalent bonds break and reform', 'They contain lone pairs', 'Their ions repel each other'], 'The bonding is non-directional, so layers slip without breaking the structure.', 'X');
Q('bonds', 3, 'Which substance has the highest melting point?', 'Diamond', ['NaCl', 'Water', 'Methane'], 'A network covalent solid needs a huge amount of energy to break every covalent bond (about 3500°C).', 'X');
Q('bonds', 1, 'What type of bond is shown when two atoms share a pair of electrons between them?', 'covalent', ['ionic', 'metallic', 'metalloid'], 'Sharing electron pairs is a covalent bond.', 'F');
Q('bonds', 1, 'A bond forms by the transfer of electrons from a metal to a nonmetal. It is…', 'ionic', ['covalent', 'metallic', 'London'], 'Transfer creates oppositely charged ions that attract each other.', 'X');
Q('bonds', 2, 'Which of these has delocalized electrons?', 'Mg', ['MgCl₂', 'CO₂', 'H₂O'], 'Only the metal element has a sea of delocalized valence electrons.', 'X');

Q('lewis', 2, 'Which atoms can have an EXPANDED octet (more than 8 electrons)?', 'Nonmetals in period 3 or below, such as P and S', ['Any element in period 2', 'Only noble gases', 'Only metals'], 'Period 3 and below have d orbitals available. Period 2 elements cannot exceed 8.', 'T');

Q('lewis', 2, 'How is an ionic compound like CaSO₄ drawn as a Lewis structure?', 'Ca²⁺ and [SO₄]²⁻ drawn separately, with the polyatomic ion in brackets', ['Ca bonded to S by a single line', 'All atoms joined with covalent bonds', 'Ca²⁺ drawn inside the brackets with sulfate'], 'The metal gives up electrons and appears as a cation. The polyatomic ion keeps its own covalent bonds and is shown in brackets with its charge.', 'T');
Q('lewis', 1, 'A Lewis structure for a polyatomic ion such as SO₄²⁻ should be placed…', 'inside square brackets with the charge written outside', ['without brackets or charge', 'with the charge inside the structure', 'only as a chemical formula'], 'Brackets show the charge belongs to the whole ion.', 'T');
Q('lewis', 3, 'In the Lewis structure of CO₃²⁻ (one resonance form), how many lone pairs are on the oxygen atoms in total?', '8', ['6', '7', '9'], 'The double-bonded O has 2 lone pairs. Each single-bonded O has 3 lone pairs: 2 + 3 + 3 = 8.', 'T');
Q('lewis', 3, 'In CO₃²⁻ the three C–O bonds are…', 'one double and two single in any one drawing, but all equal in reality (resonance)', ['all single bonds', 'all double bonds', 'two double and one single'], 'The real ion has three equivalent bonds from delocalized electrons. Each Lewis drawing is one resonance form.', 'T');
Q('lewis', 3, 'Why is the Lewis structure of SO₄²⁻ often drawn with S=O double bonds?', 'Sulfur can expand its octet, which lowers formal charges', ['Oxygen cannot form single bonds', 'The octet rule forces it', 'Sulfur has only 4 valence electrons'], 'Period 3 sulfur can hold more than 8 electrons.', 'T');
Q('lewis', 3, 'In the Lewis structure of H₃NOH⁺ (basic skeleton H₃N–O–H), what is true about N?', 'N has 4 bonds and no lone pair', ['N has 3 bonds and one lone pair', 'N has 2 bonds and 2 lone pairs', 'N has 5 bonds'], 'N is bonded to 3 H and 1 O, using all 4 pairs. Its charge is 1+, so it carries the + charge.', 'W');
Q('lewis', 3, 'In NHO₂ (H bonded to O, N central), N is bonded to…', 'one O by a single bond and the other O by a double bond', ['two H atoms', 'two O atoms by triple bonds', 'only one atom'], 'Skeleton O–N=O with H on one O. 18 electrons: N keeps one lone pair, and the bent shape results.', 'W');
Q('lewis', 1, 'In the electron dot picture of CH₄, how many dots/bonds surround carbon?', '4 bonding pairs, no lone pair', ['3 bonding pairs, 1 lone pair', '2 bonding pairs, 2 lone pairs', '4 bonding pairs, 1 lone pair'], 'C: 4 valence electrons, each forming one bond to H.', 'W');
Q('lewis', 2, 'In the Lewis structure of NH₄⁺, the ion is…', 'drawn in brackets with a + charge; N has four bonds and no lone pair', ['drawn with N having a lone pair', 'neutral', 'drawn with N=H double bond'], 'N shares all 4 pairs with H. The lone pair of NH₃ is used to bond H⁺.', 'W');

/* ---------- VSEPR ---------- */
Q('vsepr', 2, 'Predict the shape and bond angle of water (H₂O) using VSEPR.', 'Bent, about 104.5° (less than 109.5°)', ['Linear, 180°', 'Trigonal planar, 120°', 'Tetrahedral, 109.5°'], 'Oxygen has 2 bonding pairs and 2 lone pairs, so electron geometry is tetrahedral but the shape is bent. Lone pairs push the bonded atoms closer together.', 'X');
Q('vsepr', 2, 'What is the role of lone pairs in determining the shape of water?', 'They occupy space and repel bond pairs more strongly, squeezing the H–O–H angle below 109.5°', ['They have no effect on the shape', 'They increase the bond angle to 120°', 'They convert the molecule to linear'], 'Lone pair–bond pair repulsion is stronger than bond pair–bond pair repulsion.', 'X');
Q('vsepr', 3, 'Which order of repulsion strength is correct?', 'lone pair–lone pair > lone pair–bond pair > bond pair–bond pair', ['bond pair–bond pair > lone pair–bond pair > lone pair–lone pair', 'lone pair–bond pair > lone pair–lone pair > bond pair–bond pair', 'all are equal'], 'Lone pairs are held by only one nucleus so they spread out more.', 'X');
Q('vsepr', 2, 'Why is the bond angle in NH₃ (107°) smaller than the regular tetrahedral angle (109.5°)?', 'The lone pair on N repels the bonding pairs more strongly and compresses the H–N–H angle', ['N is larger than H', 'NH₃ has double bonds', 'There are no lone pairs in NH₃'], 'Four electron pairs (tetrahedral arrangement) but one is a lone pair, so the three bonds are pushed closer.', 'X');
Q('vsepr', 2, 'Arrange in DECREASING bond angle: CH₄, NH₃, H₂O', 'CH₄ > NH₃ > H₂O', ['H₂O > NH₃ > CH₄', 'NH₃ > CH₄ > H₂O', 'CH₄ > H₂O > NH₃'], 'CH₄ 109.5° (no lone pairs), NH₃ 107° (one lone pair), H₂O 104.5° (two lone pairs). More lone pairs, smaller angle.', 'X');
Q('vsepr', 2, 'Explain the geometry of SF₄.', 'Seesaw: 4 bonds + 1 lone pair on a trigonal-bipyramidal arrangement', ['Tetrahedral: 4 bonds, no lone pair', 'Square planar', 'T-shaped'], 'S has 5 electron groups (4 bonds + 1 lone pair), so electron geometry is trigonal bipyramidal and the shape is seesaw.', 'X');
Q('vsepr', 3, 'In SF₄ where does the lone pair sit?', 'In an equatorial position', ['In an axial position', 'On a fluorine atom', 'It has no preferred position'], 'Equatorial positions have only two 90° neighbours, so there is less repulsion than in axial positions.', 'X');
Q('vsepr', 3, 'In XeF₄ the two lone pairs sit…', 'on opposite sides (above and below) of the plane, giving a square planar shape', ['next to each other in the same plane', 'on the fluorine atoms', 'both on one side'], 'Placing them at 180° from each other minimizes repulsion.', 'X');
Q('vsepr', 2, 'Determine the shape of XeF₄ and the hybridization of Xe.', 'Square planar; sp³d²', ['Tetrahedral; sp³', 'Seesaw; sp³d', 'Square pyramidal; sp³d²'], 'Xe has 4 bonds + 2 lone pairs = 6 groups, octahedral electron arrangement, sp³d², and the shape is square planar.', 'X');
Q('vsepr', 2, 'What does VSEPR theory say about electron pairs around a central atom?', 'They repel each other and arrange to be as far apart as possible', ['They attract each other', 'They all lie in one plane', 'They are always in bonds'], 'The molecular shape follows from minimizing repulsion.', 'X');

Q('net', 3, 'K₂CrO₄(aq) + Ba(NO₃)₂(aq) → 2KNO₃(aq) + BaCrO₄(s). What is the net ionic equation?', 'Ba²⁺(aq) + CrO₄²⁻(aq) → BaCrO₄(s)', ['K⁺(aq) + NO₃⁻(aq) → KNO₃(aq)', '2K⁺(aq) + CrO₄²⁻(aq) → K₂CrO₄(s)', 'Ba²⁺(aq) + 2NO₃⁻(aq) → Ba(NO₃)₂(s)'], 'Cancel K⁺ and NO₃⁻ (spectators). Only barium chromate forms a solid.', 'T');
Q('net', 3, 'In K₂CrO₄ + Ba(NO₃)₂ → 2KNO₃ + BaCrO₄(s), which ions are spectators?', 'K⁺ and NO₃⁻', ['Ba²⁺ and CrO₄²⁻', 'K⁺ and CrO₄²⁻', 'Ba²⁺ and NO₃⁻'], 'They are present as ions on both sides.', 'T');
Q('net', 3, 'K₂CO₃(aq) + MgI₂(aq) → MgCO₃(s) + 2KI(aq). What is the net ionic equation?', 'Mg²⁺(aq) + CO₃²⁻(aq) → MgCO₃(s)', ['K⁺(aq) + I⁻(aq) → KI(aq)', '2K⁺(aq) + 2I⁻(aq) → 2KI(s)', 'Mg²⁺(aq) + 2I⁻(aq) → MgI₂(s)'], 'K⁺ and I⁻ are spectators.', 'T');
Q('net', 3, 'In K₂CO₃ + MgI₂ → MgCO₃(s) + 2KI, which ions are spectators?', 'K⁺ and I⁻', ['Mg²⁺ and CO₃²⁻', 'K⁺ and CO₃²⁻', 'Mg²⁺ and I⁻'], 'They remain dissolved on both sides.', 'T');
Q('net', 3, 'AgNO₃(aq) + NaCl(aq) → AgCl(s) + NaNO₃(aq). What is the net ionic equation?', 'Ag⁺(aq) + Cl⁻(aq) → AgCl(s)', ['Na⁺(aq) + NO₃⁻(aq) → NaNO₃(aq)', 'Ag⁺(aq) + NO₃⁻(aq) → AgNO₃(s)', 'Na⁺(aq) + Cl⁻(aq) → NaCl(s)'], 'Na⁺ and NO₃⁻ are spectators.', 'X');
Q('net', 2, 'Which is the correct FIRST step in writing a net ionic equation?', 'Write the balanced molecular equation with states', ['Cancel spectator ions', 'Write only the products', 'Change subscripts'], 'Balanced molecular equation, then split aqueous compounds into ions, cancel spectators.', 'T');
Q('net', 2, 'The net ionic equation for a precipitation reaction shows…', 'only the ions that combine to form the solid', ['all ions in the solution', 'only the spectator ions', 'only gas products'], 'Everything that does not change is cancelled.', 'T');

</script>
<script>
/* ---------- state ---------- */
var TOPICS=[
 ['ions','Ions &amp; naming','Polyatomic ions, formulas, ionic vs covalent names'],
 ['en','Electronegativity','ΔEN cut-offs, polar / non-polar / ionic bonds, trends'],
 ['bonds','Bond types &amp; properties','Metallic, network, ionic lattice, conductivity, melting points'],
 ['lewis','Lewis structures','Valence electron counts, lone pairs, octet exceptions'],
 ['vsepr','VSEPR &amp; geometry','Shapes, bond angles, hybridization, the AXE table'],
 ['polar','Molecular polarity','Does the shape cancel the dipoles?'],
 ['imf','Intermolecular forces','London, dipole-dipole, hydrogen bonding, boiling points'],
 ['types','Reaction types','Synthesis, decomposition, displacement, combustion'],
 ['bal','Balancing equations','Pick the correctly balanced equation'],
 ['pred','Predicting products','Reactivity series, displacement, double displacement'],
 ['net','Net ionic equations','Spectator ions and precipitates']
];
var KEY='chemdrills.v1';
var prog=load();
var diff=0, queue=[], qi=0, cur=null, chosen=[], tries=0, done=false, scope='mixed';

function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}
  return {ans:0,first:0,streak:0,best:0,t:{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(prog))}catch(e){}}
function tp(t){if(!prog.t[t])prog.t[t]={a:0,f:0};return prog.t[t]}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function count(t){return t==='mixed'?BANK.filter(byDiff).length:BANK.filter(function(q){return q.t===t&&byDiff(q)}).length}
function byDiff(q){return !diff||q.d===diff}

/* ---------- board ---------- */
function renderBoard(){
  var tot=BANK.filter(byDiff).length;
  document.getElementById('sTot').textContent=prog.ans;
  document.getElementById('sFirst').textContent=prog.ans?Math.round(prog.first/prog.ans*100)+'%':'—';
  document.getElementById('sStreak').textContent=prog.streak+(prog.best>prog.streak?' / '+prog.best:'');
  document.getElementById('sBank').textContent=tot;
  var dc=document.getElementById('diffChips');
  dc.innerHTML=[[0,'All levels'],[1,'Level 1 · basics'],[2,'Level 2 · core'],[3,'Level 3 · stretch']].map(function(p){
    return '<button class="chip" type="button" aria-pressed="'+(diff===p[0])+'" data-d="'+p[0]+'">'+p[1]+'</button>'}).join('');
  var g=document.getElementById('topicGrid');
  var mixN=count('mixed');
  var html='<button class="topic mixed" type="button" data-t="mixed"><span class="tt">Mixed review</span>'+
    '<span class="td">Everything shuffled together — closest to a real test.</span>'+
    '<span class="meta"><span>'+mixN+' questions ready</span><span>Start →</span></span></button>';
  html+=TOPICS.map(function(T){
    var n=count(T[0]); if(!n) return '';
    var p=tp(T[0]); var pct=p.a?Math.round(p.f/p.a*100):0;
    return '<button class="topic" type="button" data-t="'+T[0]+'"><span class="tt">'+T[1]+'</span>'+
      '<span class="td">'+T[2]+'</span>'+
      '<span class="bar"><i style="width:'+pct+'%"></i></span>'+
      '<span class="meta"><span>'+n+' questions</span><span>'+(p.a?pct+'% first try':'not started')+'</span></span></button>'
  }).join('');
  g.innerHTML=html;
}
document.addEventListener('click',function(e){
  var c=e.target.closest('.chip[data-d]'); if(c){diff=+c.dataset.d;renderBoard();return}
  var t=e.target.closest('.topic[data-t]'); if(t){start(t.dataset.t);return}
});

/* ---------- quiz ---------- */
function start(t){
  scope=t;
  var pool=BANK.filter(function(q){return byDiff(q)&&(t==='mixed'||q.t===t)});
  queue=shuffle(pool); qi=0;
  document.getElementById('board').hidden=true;
  document.getElementById('quiz').hidden=false;
  window.scrollTo(0,0);
  showQ();
}
function back(){
  document.getElementById('quiz').hidden=true;
  document.getElementById('board').hidden=false;
  renderBoard(); window.scrollTo(0,0);
}
function label(t){for(var i=0;i<TOPICS.length;i++)if(TOPICS[i][0]===t)return TOPICS[i][1];return 'Mixed'}
function showQ(){
  var box=document.getElementById('quiz');
  if(qi>=queue.length){
    box.innerHTML='<div class="card"><h2 style="font-size:1.2rem">Set finished</h2>'+
      '<p style="color:var(--muted);margin:.6rem 0 0">You worked through all '+queue.length+' questions in this set. '+
      'Streak is now '+prog.streak+'.</p>'+
      '<div class="actions"><button class="primary" type="button" data-act="again">Shuffle and go again</button>'+
      '<button class="ghost" type="button" data-act="back">Back to topics</button></div></div>';
    return;
  }
  cur=queue[qi]; chosen=[]; tries=0; done=false;
  cur._o=cur._o||shuffle(cur.o);
  var parts=cur.q.split('\n');
  var qhtml=esc(parts[0])+(parts[1]?'<span class="eq">'+esc(parts.slice(1).join('\n'))+'</span>':'');
  box.innerHTML='<div class="card">'+
    '<div class="qhead"><span class="tag">'+label(cur.t)+'</span>'+
      '<span class="tag d'+cur.d+'">Level '+cur.d+'</span>'+
      (cur.m?'<span class="tag">Select all</span>':'')+
      '<span class="qnum">'+(qi+1)+' / '+queue.length+'</span></div>'+
    '<div class="qtext">'+qhtml+'</div>'+
    (cur.m?'<div class="hintline">More than one answer is correct — tick every one that applies.</div>':'')+
    '<div class="opts" id="opts"></div>'+
    '<div class="actions"><button class="primary" id="checkBtn" type="button" disabled>Check answer</button>'+
      '<button class="ghost" type="button" data-act="back">Topics</button>'+
      '<span class="tries" id="tries"></span></div>'+
    '<div id="fb"></div>'+
    '<div class="progwrap"><div class="bar"><i style="width:'+Math.round(qi/queue.length*100)+'%"></i></div></div>'+
  '</div>';
  renderOpts(); renderTries();
}
function renderOpts(){
  var o=document.getElementById('opts');
  o.innerHTML=cur._o.map(function(txt,i){
    var sel=chosen.indexOf(txt)>-1;
    var cls='opt'+(cur.m?' multi':'');
    if(done){ if(cur.c.indexOf(txt)>-1)cls+=' correct'; else if(sel)cls+=' wrong' }
    return '<button class="'+cls+'" type="button" data-i="'+i+'" aria-pressed="'+sel+'"'+(done?' disabled':'')+'>'+
      '<span class="box">'+(sel||(done&&cur.c.indexOf(txt)>-1)?'✓':String.fromCharCode(65+i))+'</span>'+
      '<span class="txt">'+esc(txt)+'</span></button>'
  }).join('');
}
function renderTries(){
  var d=''; for(var i=0;i<3;i++) d+='<i class="'+(i<tries?'used':'')+'"></i>';
  document.getElementById('tries').innerHTML='Attempts<span class="dots">'+d+'</span>';
}
document.addEventListener('click',function(e){
  var a=e.target.closest('[data-act]');
  if(a){ if(a.dataset.act==='back')back();
         else if(a.dataset.act==='next'){qi++;showQ();window.scrollTo(0,0)}
         else if(a.dataset.act==='again'){start(scope)} return }
  var op=e.target.closest('.opt'); if(op&&!done){
    var txt=cur._o[+op.dataset.i];
    if(cur.m){ var k=chosen.indexOf(txt); if(k>-1)chosen.splice(k,1); else chosen.push(txt) }
    else chosen=[txt];
    renderOpts(); document.getElementById('checkBtn').disabled=!chosen.length; return }
  if(e.target.id==='checkBtn') check();
});
function same(a,b){ if(a.length!==b.length)return false; for(var i=0;i<a.length;i++)if(b.indexOf(a[i])<0)return false; return true }
function check(){
  if(!chosen.length) return;
  var right=same(chosen,cur.c);
  var fb=document.getElementById('fb');
  var src=SRC[cur.s]||'Extra practice';
  if(right){
    done=true; tries++;
    prog.ans++; if(tries===1)prog.first++;
    prog.streak=tries===1?prog.streak+1:0; if(prog.streak>prog.best)prog.best=prog.streak;
    var p=tp(cur.t); p.a++; if(tries===1)p.f++;
    save(); renderOpts(); renderTries();
    fb.innerHTML='<div class="feedback ok"><b>'+(tries===1?'Correct — first try.':'Correct.')+'</b>'+
      '<div class="why">'+esc(cur.x)+'</div><div class="srcline">Source: '+src+'</div></div>'+
      '<div class="actions"><button class="primary" type="button" data-act="next">Next question →</button></div>';
    document.getElementById('checkBtn').disabled=true;
    return;
  }
  tries++;
  if(tries<3){
    renderTries();
    var left=3-tries;
    fb.innerHTML='<div class="feedback no"><b>Not quite.</b><div class="why">'+
      (cur.m?'Check how many answers should be ticked. ':'')+
      left+' attempt'+(left===1?'':'s')+' left — have another look.</div></div>';
    chosen=[]; renderOpts(); document.getElementById('checkBtn').disabled=true;
  } else {
    done=true;
    prog.ans++; prog.streak=0; tp(cur.t).a++; save();
    renderOpts(); renderTries();
    fb.innerHTML='<div class="feedback out"><b>Out of attempts. The answer is '+
      esc(cur.c.join(' + '))+'.</b><div class="why">'+esc(cur.x)+'</div>'+
      '<div class="srcline">Source: '+src+'</div></div>'+
      '<div class="actions"><button class="primary" type="button" data-act="next">Next question →</button></div>';
    document.getElementById('checkBtn').disabled=true;
  }
}

/* ---------- chrome ---------- */
document.getElementById('themeBtn').onclick=function(){
  var r=document.documentElement;
  var dark=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);
  r.setAttribute('data-theme',dark?'light':'dark');
  try{localStorage.setItem(KEY+'.theme',dark?'light':'dark')}catch(e){}
};
try{var th=localStorage.getItem(KEY+'.theme'); if(th)document.documentElement.setAttribute('data-theme',th)}catch(e){}
document.getElementById('resetBtn').onclick=function(){
  prog={ans:0,first:0,streak:0,best:0,t:{}}; save(); renderBoard();
  this.textContent='Progress cleared'; var b=this; setTimeout(function(){b.textContent='Reset progress'},1600);
};
document.getElementById('sub').innerHTML=BANK.length+' questions · bonding, VSEPR, reactions &amp; equations';
renderBoard();
</script>

</body>
</html>
